
name: DID YOU KNOW - Code Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check application code
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          for file in netlify/functions/*.js; do
            node --check "$file"
          done
          node --check personalization.js
          node --check tests/personalization.test.js

      - name: Run personalization tests
        run: node --test tests/personalization.test.js

      - name: Run offline integration checks
        env:
          GEMINI_API_KEY: local-test-key
          GEMINI_TEST_SECRET: local-test-secret
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");

          const { handler } =
            require("./netlify/functions/generate-articles");
          const { verifyArticle } =
            require("./netlify/functions/verify-article");
          const { verifySources } =
            require("./netlify/functions/verify-sources");
          const { factCheck } =
            require("./netlify/functions/fact-check");

          async function main() {
            assert.equal(typeof handler, "function");
            assert.equal(typeof verifyArticle, "function");
            assert.equal(typeof verifySources, "function");
            assert.equal(typeof factCheck, "function");

            assert.equal(verifyArticle(null).passed, false);

            assert.equal(verifyArticle({
              title: "בדיקה",
              teaser: "בדיקה",
              category: "מדע",
              body: "קצר מדי",
              sources: []
            }).passed, false);

            let calls = 0;
            const originalFetch = global.fetch;

            global.fetch = async url => {
              calls++;

              if (String(url).includes("/models?")) {
                return {
                  ok: true,
                  json: async () => ({
                    models: [{
                      name: "models/gemini-3.5-flash-lite",
                      supportedGenerationMethods: [
                        "generateContent"
                      ]
                    }]
                  })
                };
              }

              if (String(url).includes(":generateContent")) {
                return {
                  ok: true,
                  json: async () => ({
                    candidates: [{
                      content: {
                        parts: [{
                          text: JSON.stringify({
                            title: "כתבת בדיקה",
                            teaser: "טקסט לבדיקה",
                            category: "מדע",
                            body: "קצר מדי",
                            sources: []
                          })
                        }]
                      }
                    }]
                  })
                };
              }

              throw new Error(
                "Unexpected external request: " + url
              );
            };

            try {
              const denied = await handler({
                httpMethod: "GET",
                queryStringParameters: {
                  code: "wrong"
                }
              });

              assert.equal(denied.statusCode, 403);
              assert.equal(calls, 0);

              const method = await handler({
                httpMethod: "POST"
              });

              assert.equal(method.statusCode, 405);
              assert.equal(calls, 0);

              const generated = await handler({
                httpMethod: "GET",
                queryStringParameters: {
                  code: "local-test-secret"
                }
              });

              assert.equal(generated.statusCode, 200);

              const result = JSON.parse(generated.body);

              assert.equal(result.quality.passed, false);
              assert.equal(result.published, false);
              assert.equal(
                result.verification,
                "QUALITY_FAILED"
              );
              assert.equal(calls, 2);

            } finally {
              global.fetch = originalFetch;
            }

            const review = await factCheck(
              { body: "טקסט לבדיקה" },
              { sources: [] },
              "local-test-key"
            );

            assert.equal(
              review.publicationApproved,
              false
            );
            assert.equal(review.factChecked, false);
            assert.equal(
              review.status,
              "NEEDS_FACT_CHECK"
            );

            console.log(
              "Offline integration checks passed"
            );
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
