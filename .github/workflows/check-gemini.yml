name: DID YOU KNOW - Check Gemini

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-gemini.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          const models = [
            'gemini-3.1-flash-lite',
            'gemini-2.5-flash-lite',
            'gemini-3.5-flash-lite',
            'gemini-flash-lite-latest',
            'gemini-3.5-flash',
            'gemini-3.8-flash'
          ];

          const key = process.env.GEMINI_API_KEY;

          if (!key) {
            throw new Error('Missing API key');
          }

          const working = [];

          for (const model of models) {
            console.log('\nTesting: ' + model);

            try {
              const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
                {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': key
                  },
                  body: JSON.stringify({
                    contents: [{
                      parts: [{
                        text: 'Reply with the word OK.'
                      }]
                    }],
                    generationConfig: {
                      maxOutputTokens: 128
                    }
                  }),
                  signal: AbortSignal.timeout(30000)
                }
              );

              const data = await response.json();

              if (response.ok) {
                const output = data.candidates?.[0]?.content?.parts
                  ?.filter(p => !p.thought)
                  .map(p => p.text || '')
                  .join('');

                if (output?.trim()) {
                  console.log('SUCCESS: ' + model);
                  working.push(model);
                } else {
                  console.log('No text returned');
                }
              } else {
                console.log('HTTP ' + response.status);
                console.log(data.error?.message || 'Unknown error');
              }
            } catch (error) {
              console.log('ERROR: ' + error.message);
            }

            await new Promise(resolve => setTimeout(resolve, 3000));
          }

          console.log('\n=== FINAL RESULTS ===');

          if (working.length) {
            console.log('Working models:');
            working.forEach(model => console.log(model));
          } else {
            console.log('No working models found');
            process.exitCode = 1;
          }
          JS
