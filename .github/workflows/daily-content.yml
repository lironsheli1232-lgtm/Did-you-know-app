
name: DID YOU KNOW - Daily Content

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-content.yml'

permissions:
  contents: read

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  generate:
    name: Generate daily articles
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is missing"
            exit 1
          fi
          echo "API key is configured"

      - name: Generate articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          DAILY_ARTICLE_COUNT: '5'
        run: node scripts/generate-content.mjs

      - name: Check generated database
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const db = JSON.parse(fs.readFileSync("content/articles.json", "utf8"));
          console.log("Database version:", db.version);
          console.log("Updated:", db.updatedAt);
          console.log("Total articles:", db.articles.length);
          if (!db.articles.length) process.exit(1);
          '

      - name: Upload generated articles
        uses: actions/upload-artifact@v4
        with:
          name: generated-articles
          path: content/articles.json
          retention-days: 7
