const categoryMap={"כדורגל":"ספורט","כדורסל":"ספורט","ספורט":"ספורט","חלל":"מדע וחלל","מדע":"מדע וחלל","היסטוריה":"היסטוריה","פסיכולוגיה":"פסיכולוגיה","פילוסופיה":"פילוסופיה","בעלי חיים":"טבע ובעלי חיים","ים וטבע":"טבע ובעלי חיים","טבע":"טבע ובעלי חיים","אוקיינוסים":"טבע ובעלי חיים","גאוגרפיה":"טבע ובעלי חיים","המצאות":"טכנולוגיה","גוף האדם":"גוף האדם"};
const categoryOf=s=>categoryMap[s.category]||s.category;
const U="https://images.unsplash.com/";
const demo=[
["space-diamond","חלל","האם באמת יכול לרדת גשם של יהלומים בכוכבי לכת?","בתנאים קיצוניים, פחמן עשוי להידחס ולהתגבש ליהלומים עמוק בתוך ענקי קרח.","photo-1462331940025-496dfbfc7564","בכוכבי לכת כמו אורנוס ונפטון שוררים לחצים וטמפרטורות שקשה לדמיין. מודלים וניסויי מעבדה מצביעים על כך שפחמימנים יכולים להתפרק בתנאים האלה, והפחמן עשוי להתגבש ליהלומים זעירים ששוקעים פנימה.","הביטוי ״גשם יהלומים״ הוא תיאור ציורי לתהליך אפשרי עמוק בתוך כוכב הלכת — לא אבנים נוצצות שנופלות מעננים כמו גשם בכדור הארץ. מדענים משתמשים בניסויי לחץ קיצוני כדי לבדוק את התהליך וללמוד על המבנה הפנימי של ענקי הקרח.","היהלומים האפשריים האלה עשויים להיווצר בעומק רב, ולא על פני השטח.","באילו כוכבי לכת נחקרת האפשרות של ״גשם יהלומים״?",["נוגה ומאדים","אורנוס ונפטון","כדור הארץ וצדק"],1,["https://science.nasa.gov/uranus/","https://science.nasa.gov/neptune/"]],
["memory-embarrassment","פסיכולוגיה","למה רגע מביך אחד יכול להישאר בראש במשך שנים?","המוח שלנו נותן משקל מיוחד לאירועים חברתיים — גם כשהסביבה כבר מזמן שכחה מהם.","photo-1500530855697-b586d89ba3ee","זיכרונות רגשיים נוטים להיות בולטים יותר מזיכרונות ניטרליים. כשאנחנו מרגישים מבוכה, תשומת הלב שלנו מתמקדת בעצמנו ובאופן שבו אחרים אולי תופסים אותנו.","יש גם תופעה שנקראת אפקט הזרקור: אנחנו נוטים להעריך יתר על המידה עד כמה אחרים שמים לב להתנהגות ולמראה שלנו. בפועל, אנשים אחרים עסוקים לרוב בעצמם הרבה יותר מכפי שנדמה לנו.","התחושה שכולם זוכרים את הרגע המביך יכולה להיות חזקה בהרבה מהמציאות.","מה מתאר ״אפקט הזרקור״?",["הערכת יתר של תשומת הלב שאחרים מקדישים לנו","יכולת לזכור כל פרט","פחד ממקומות מוארים"],0,["https://www.apa.org/"]],
["underground-city","היסטוריה","העיר התת-קרקעית שבה יכלו להסתתר אלפי אנשים","בקפדוקיה שבטורקיה נמצאות ערים חצובות בסלע, עם חדרים, מעברים ומערכות אוורור.","photo-1603565816030-6b389eeb23cb","באזור קפדוקיה נבנו לאורך מאות שנים חללים תת-קרקעיים ששימשו למגורים, אחסון ולעיתים גם כמקומות מסתור בתקופות של סכנה. דרינקויו היא אחת הערים התת-קרקעיות המפורסמות באזור.","המתחם כולל מפלסים רבים, מעברים צרים, חללי אחסון, אזורי מגורים ופתחי אוורור. הוא מדגים כיצד בני אדם התאימו את סביבת המחיה שלהם לאבן הגעשית הרכה של האזור.","חלק מהמתחמים התת-קרקעיים מגיעים לעומק של עשרות מטרים.","באיזו מדינה נמצאת דרינקויו?",["יוון","טורקיה","איטליה"],1,["https://whc.unesco.org/en/list/"]],
["offside","כדורגל","איך נולד אחד החוקים הכי מתווכחים בכדורגל?","חוק הנבדל התפתח לאורך השנים, והגרסאות הראשונות שלו היו מחמירות בהרבה מהחוק שאנחנו מכירים.","photo-1522778119026-d647f0596c20","חוקי הכדורגל הראשונים באנגליה במאה ה-19 כללו מגבלות נבדל שונות. בגרסאות מוקדמות, שחקן התקפה היה צריך להיות מאחורי הכדור או מאחורי מספר גדול של שחקני יריב כדי לקבל מסירה.","החוק שונה כמה פעמים כדי לעודד משחק התקפי. ב-1925 הוקלה דרישת מספר שחקני היריב, והשינוי תרם לעלייה במספר השערים. כיום נבדל נבחן ברגע שבו חבר לקבוצה משחק או נוגע בכדור, ובהתאם למיקום ולמעורבות של השחקן.","שינוי חוק הנבדל ב-1925 נחשב לאחד השינויים שהשפיעו מאוד על הטקטיקה והבקעת השערים.","באיזו שנה שונתה דרישת מספר שחקני היריב?",["1888","1925","1992"],1,["https://www.theifab.com/laws/latest/offside/","https://www.fifa.com/"]],
["axolotl","בעלי חיים","היצור שיכול להצמיח מחדש רגל — ואפילו חלקים מהלב","האקסולוטל הוא סלמנדרה יוצאת דופן שמסוגלת לחדש איברים ורקמות.","photo-1551986782-d0169b3f8fa7","האקסולוטל, דו-חי שמקורו באגמים באזור מקסיקו, ידוע ביכולת ההתחדשות המרשימה שלו. הוא יכול להצמיח מחדש גפיים, זנב, וחלקים מרקמות שונות, ובמחקר נבדקת גם יכולתו לשקם רקמות בלב ובמערכת העצבים.","החוקרים מנסים להבין אילו תהליכים תאיים וגנטיים מאפשרים את ההתחדשות הזו. המטרה אינה להפוך בני אדם לאקסולוטלים, אלא ללמוד עקרונות שעשויים בעתיד לעזור ברפואה משקמת.","האקסולוטל שומר על מאפיינים של שלב צעיר לאורך כל חייו — תופעה שנקראת ניאוטניה.","מהי אחת היכולות המיוחדות של האקסולוטל?",["לייצר אור","לחדש גפיים","לעוף למרחקים"],1,["https://www.nationalgeographic.com/animals/amphibians/facts/axolotl","https://www.nature.com/"]],
["octopus","ים וטבע","התמנון: בעל חיים עם שלושה לבבות ודם כחול","הגוף של התמנון בנוי אחרת משלנו — וזה עוזר לו להתמודד עם החיים מתחת למים.","photo-1545670723-196ed0954986","לתמנון יש שלושה לבבות: שניים מזרים דם אל הזימים, והשלישי מזרים אותו לשאר הגוף. הדם שלו כחול משום שהוא משתמש בהמוציאנין, חלבון שמכיל נחושת ונושא חמצן.","ההמוציאנין מתאים לסביבה ימית קרה ודלת חמצן, אך הוא פחות יעיל בהיבטים מסוימים מהמוגלובין. המבנה הזה הוא אחת ההתאמות המרתקות של בעלי החיים הימיים.","הלב שמזרים דם לגוף מפסיק לפעום בזמן שהתמנון שוחה, ולכן הוא נוטה לזחול יותר מאשר לשחות למרחקים.","כמה לבבות יש לתמנון?",["אחד","שניים","שלושה"],2,["https://ocean.si.edu/ocean-life/invertebrates/octopus"]],
["moon","מדע","הירח מתרחק מאיתנו בכל שנה","המרחק בינינו לבין הירח גדל בכמה סנטימטרים בשנה — ואפשר למדוד את זה.","photo-1446776811953-b23d57bd21aa","הירח מתרחק מכדור הארץ בקצב ממוצע של כ-3.8 סנטימטרים בשנה. הסיבה קשורה לאינטראקציה הכבידתית בין כדור הארץ לירח ולגאות והשפל באוקיינוסים.","מדענים מדדו את המרחק בעזרת מחזירי לייזר שהוצבו על הירח במשימות אפולו ובמשימות רובוטיות. שולחים אליהם פולס לייזר ומודדים כמה זמן לוקח לאור לחזור.","המדידה נעשית בדיוק גבוה באמצעות לייזרים ומחזירי אור על פני הירח.","איך מודדים את המרחק לירח בדיוק גבוה?",["באמצעות מכ״ם רגיל","באמצעות לייזר","באמצעות GPS"],1,["https://science.nasa.gov/moon/"]],
["honey","טבע","דבש יכול להישאר אכיל במשך אלפי שנים","השילוב של מעט מים, חומציות וחומרים טבעיים מקשה על מיקרואורגניזמים להתפתח בדבש.","photo-1587049352851-8d4e89133924","דבש הוא מזון בעל פעילות מים נמוכה וחומציות יחסית גבוהה. בנוסף, דבורים מוסיפות אנזימים שתורמים ליצירת חומרים בעלי פעילות אנטי-מיקרוביאלית.","התנאים האלה מקשים על רוב החיידקים והעובשים להתרבות. עם זאת, דבש יכול לספוג לחות ולהתקלקל בתנאי אחסון לא מתאימים, ולכן חשוב לשמור אותו סגור ויבש.","הסיבה העיקרית לעמידות הדבש היא לא קסם — אלא הכימיה והכמות הנמוכה של מים זמינים.","מה מקשה על מיקרואורגניזמים לגדול בדבש?",["כמות מים זמינים נמוכה וחומציות","טמפרטורה גבוהה תמיד","היעדר סוכר"],0,["https://www.nationalgeographic.com/"]],
["deep-sea","אוקיינוסים","במעמקי האוקיינוס יש חיים גם בלי אור שמש","מערכות אקולוגיות שלמות מתקיימות סביב נביעות הידרותרמיות, בעזרת אנרגיה כימית.","photo-1559827260-dc66d52bef19","בקרקעית האוקיינוס נמצאות נביעות הידרותרמיות שפולטות מים חמים ועשירים במינרלים. סביבן חיים חיידקים שמפיקים אנרגיה מתגובות כימיות — תהליך שנקרא כימוסינתזה.","החיידקים האלה מהווים בסיס למארג מזון שכולל תולעים, סרטנים ובעלי חיים נוספים. זו דוגמה לכך שחיים יכולים לשגשג גם במקום שאין בו אור שמש.","במערכות האלה, הבסיס של שרשרת המזון אינו פוטוסינתזה אלא כימוסינתזה.","מה מספק את האנרגיה הראשונית במערכות סביב נביעות הידרותרמיות?",["אור שמש","תגובות כימיות","רוח"],1,["https://oceanexplorer.noaa.gov/"]],
["brain-sleep","גוף האדם","המוח לא באמת נכבה כשאנחנו נרדמים","במהלך השינה המוח ממשיך לעבוד — ומבצע תהליכים חשובים של זיכרון, ויסות והתאוששות.","photo-1511295742362-92c96b9d9e20","השינה כוללת מחזורים ושלבים שונים, ובהם שנת REM ושינה שאינה REM. הפעילות המוחית משתנה לאורך הלילה, אך אינה נפסקת.","במהלך השינה מתרחשים תהליכים הקשורים לגיבוש זיכרונות, לוויסות רגשי ולתפקודים גופניים. לכן שינה אינה רק מנוחה פסיבית — היא חלק פעיל מתחזוקת הגוף והמוח.","במהלך לילה רגיל אנחנו עוברים כמה מחזורי שינה, שכל אחד מהם נמשך בערך 90 דקות בממוצע.","מה נכון לגבי המוח בזמן שינה?",["הוא מפסיק לפעול","הוא ממשיך להיות פעיל","רק חלק אחד ממנו עובד תמיד"],1,["https://www.ninds.nih.gov/health-information/disorders/brain-basics-understanding-sleep"]],
["stoicism","פילוסופיה","מה באמת התכוונו הסטואים כשאמרו לשלוט במה שאפשר?","הפילוסופיה העתיקה מציעה הבחנה פשוטה שעדיין שימושית בימים עמוסים.","photo-1494438639946-1ebd1d20bf85","הסטואים, ובהם אפיקטטוס ומרקוס אורליוס, הבחינו בין דברים שנמצאים בשליטתנו לבין דברים שאינם בשליטתנו. הרעיון לא היה להפסיק להרגיש, אלא להשקיע מאמץ בפעולות ובשיפוטים שלנו במקום לנסות לשלוט בכל תוצאה.","למשל, לפני מבחן אפשר להתכונן היטב, אך אי אפשר לשלוט לחלוטין בשאלות שיופיעו או בהרגשה בזמן הבחינה. הבחנה כזו יכולה להפחית מאבק מיותר עם חוסר ודאות.","סטואיות אינה דרישה להיות אדישים; היא דרך להתייחס לרגשות בלי לתת להם לנהל כל החלטה.","מה נחשב לפי הסטואים קרוב יותר לשליטתנו?",["מזג האוויר","הבחירות והפעולות שלנו","דעתם של כל האנשים"],1,["https://plato.stanford.edu/entries/stoicism/"]],
["printing","המצאות","איך מכונת דפוס אחת שינתה את הדרך שבה ידע עובר בעולם?","לפני מאות שנים, שכפול ספר היה משימה איטית ויקרה במיוחד.","photo-1507842217343-583bb7270b66","באירופה של המאה ה-15, יוהנס גוטנברג פיתח מערכת הדפסה שהתבססה על אותיות מתכת ניידות, דיו ומכבש. היא אפשרה להפיק עותקים רבים של טקסט במהירות גבוהה בהרבה מהעתקה ידנית.","הדפוס לא יצר לבדו את הרנסנס או את הרפורמציה, אבל הוא האיץ מאוד הפצת רעיונות, ויכוחים, ספרי לימוד ומידע. מערכות דפוס התפתחו גם במזרח אסיה הרבה קודם לכן.","הדפוס הפך את התפוצה של רעיון לחלק מהסיפור שלו, ולא רק את התוכן עצמו.","מה היה יתרון מרכזי של הדפוס?",["שכפול מהיר יותר של טקסט","ביטול הצורך בשפה","יצירת חשמל"],0,["https://www.britannica.com/technology/printing-press"]],
["volcano","גאוגרפיה","למה הרי געש נוצרים דווקא במקומות מסוימים?","הרי געש אינם מפוזרים באופן מקרי על פני כדור הארץ.","photo-1464822759023-fed622ff2c3b","רבים מהרי הגעש נמצאים ליד גבולות בין לוחות טקטוניים. באזורי הפחתה, לוח אחד שוקע מתחת לאחר, ותהליכים בעומק מסייעים ליצירת מאגמה. בגבולות אחרים, הלוחות מתרחקים ומאגמה עולה למלא את המרווח.","יש גם הרי געש שנמצאים הרחק מגבולות הלוחות, כמו בהוואי, ומקושרים למוקדים חמים במעטפת כדור הארץ. לכן המיקום של הר געש יכול ללמד על תהליכים עמוקים שאיננו רואים.","טבעת האש סביב האוקיינוס השקט כוללת ריכוז גדול במיוחד של הרי געש ורעידות אדמה.","מה קשור לרבים מהרי הגעש?",["תנועת לוחות טקטוניים","תנועת עננים","גאות הירח בלבד"],0,["https://www.usgs.gov/programs/VHP"]],
["penalty","ספורט","למה פנדל מרגיש לפעמים כמו משחק פסיכולוגי יותר מכדורגל?","מרחק קצר, החלטה בשבריר שנייה ולחץ עצום על הבועט והשוער.","photo-1579952363873-27f3bade9f55","בבעיטת עונשין השוער חייב להחליט כיצד להגיב בתוך זמן קצר מאוד. הבועט, לעומתו, בוחר בין עוצמה, דיוק, גובה וכיוון, ולעיתים גם מנסה לקרוא את תנועת השוער.","הפסיכולוגיה חשובה: לחץ קהל, משמעות הבעיטה וסדר הבועטים בדו-קרב עשויים להשפיע על קבלת ההחלטות. אבל אין נוסחה אחת שמבטיחה הצלחה, ושחקנים שונים משתמשים באסטרטגיות שונות.","גם החלטה להישאר במרכז השער יכולה להיות בחירה אסטרטגית ולא חוסר תגובה.","מהו גורם שעשוי להשפיע על בעיטת פנדל?",["רק צבע הכדור","לחץ וקבלת החלטות","רק מזג האוויר"],1,["https://www.theifab.com/laws/latest/determining-the-outcome-of-a-match/"]],
["ants","בעלי חיים","איך נמלים מצליחות למצוא את הדרך הביתה בלי מפה?","מושבות שלמות מתאמות תנועה בעזרת אותות פשוטים ומידע מהסביבה.","photo-1581852017103-68ac65514cf7","מינים רבים של נמלים משאירים על הקרקע פרומונים — חומרים כימיים שיכולים לסמן מסלולים למזון. נמלים אחרות קולטות את הסימנים, וכך עשוי להיווצר שביל שבו משתמשות נמלים רבות.","אבל לא כל הנמלים מסתמכות על אותה שיטה. יש מינים שמשתמשים גם ברמזים חזותיים, באור השמש ובספירת צעדים בקירוב. היכולת הקבוצתית נוצרת מפעולות של פרטים רבים, בלי צורך במנהלת שמכוונת את כולם.","השביל הכימי יכול להשתנות כשהמזון נגמר או כשהסביבה משתנה.","מה הם פרומונים?",["אותות כימיים","קרני לייזר","סוג של אבן"],0,["https://www.britannica.com/animal/ant"]]

let edition=demo.slice(),shared=[],sharedSettings={},saved=new Set(read("dyk_saved",[])),history=read("dyk_history_v1",{}),sourceIsDemo=true;
const allStories=()=>[...shared,...demo];
const savedCopies=()=>read("dyk_saved_stories_v1",{});
function findStory(id){
  const live=allStories().find(s=>s.id===id)||edition.find(s=>s.id===id);
  if(live)return live;
  const copy=savedCopies()[id];
  if(copy&&copy.id===id)return copy;
  const archive=read("dyk_archive",{});
  for(const day of Object.keys(archive).sort().reverse()){
    const entry=archive[day];
    if(Array.isArray(entry)){
      const found=entry.find(s=>s&&s.id===id);
      if(found)return found;
    }
  }
  return null;
}
function rememberSavedStory(s){
  if(!s||!s.id)return;
  const copies=savedCopies();
  copies[s.id]=s;
  write("dyk_saved_stories_v1",copies);
}
function forgetSavedStory(id){
  const copies=savedCopies();
  delete copies[id];

}
function record(story,action){const engine=window.DYKPersonalization;if(!engine||typeof engine.recordInteraction!=="function")return;try{history=engine.recordInteraction(history,story,action);write("dyk_history_v1",history)}catch(e){console.warn("History update failed",e)}}
function normalizeStory(s){return {...s,body:Array.isArray(s.body)?s.body:[],sources:Array.isArray(s.sources)?s.sources:[],fact:typeof s.fact==="string"?s.fact:"",quiz:s.quiz&&typeof s.quiz.q==="string"&&Array.isArray(s.quiz.a)?s.quiz:null,isDemo:false}}
function card(s,i){return `<section class="story" data-id="${escapeHtml(s.id)}"><img loading="lazy" src="${safeUrl(s.image)}" alt="" onerror="this.style.display='none'"><div class="counter">${String(i+1).padStart(2,"0")} / ${String(edition.length).padStart(2,"0")}</div><div class="story-content"><div class="tag">${escapeHtml(s.category)}</div><h1>${escapeHtml(s.title)}</h1><p class="teaser">${escapeHtml(s.teaser)}</p><div class="actions"><button class="primary" data-open="${escapeHtml(s.id)}">לגלות את הסיפור</button><button class="secondary" data-save="${escapeHtml(s.id)}">${saved.has(s.id)?"♥ שמור":"♡ שמירה"}</button></div></div></section>`}
function renderFeed(){const feed=$("#feed");feed.innerHTML=edition.length?edition.map(card).join(""):'<div class="empty">אין כתבות להצגה כרגע.</div>'}
function openOverlay(title,html){$("#overlayTitle").textContent=title;$("#overlayBody").innerHTML=html;$("#overlay").classList.add("open");$("#overlay").scrollTop=0}

function articleHtml(s){const quiz=s.quiz;const quizHtml=quiz?`<div class="quiz"><strong>בדיקת ידע קטנה</strong><p>${escapeHtml(quiz.q)}</p>${quiz.a.map((a,i)=>`<button data-quiz="${i}" data-correct="${Number(quiz.correct)}">${escapeHtml(a)}</button>`).join("")}<p class="muted" id="quizResult"></p></div>`:"";const sources=(s.sources||[]).filter(u=>safeUrl(u));return `<div class="tag">${escapeHtml(s.category)}</div><h1>${escapeHtml(s.title)}</h1><img class="article-img" src="${safeUrl(s.image)}" alt=""><p class="article-body">${escapeHtml(s.teaser)}</p><div class="article-body">${s.body.map((p,i)=>`<p>${escapeHtml(p)}</p>${i===0&&s.body.length>1?"<h2>מה הופך את זה למיוחד?</h2>":""}`).join("")}${s.fact?`<div class="surprise"><strong>עוד משהו שכדאי לדעת</strong><p>${escapeHtml(s.fact)}</p></div>`:""}</div>${quizHtml}<h2>מקורות להעמקה</h2><div class="source-list">${sources.length?sources.map((u,i)=>`<a href="${safeUrl(u)}" target="_blank" rel="noopener noreferrer">מקור ${i+1} — פתיחת האתר ↗</a>`).join(""):'<p class="muted">לא צורפו מקורות לכתבה זו.</p>'}</div>${s.isDemo?'<p class="muted">זוהי כתבת הדגמה. אין לראות בה מחקר עדכני שנבדק אוטומטית.</p>':""}`}
function openArticle(id){const s=findStory(id);if(!s)return;record(s,"open");openOverlay("הסיפור המלא",articleHtml(s))}
function listView(kind){if(kind==="saved"){const items=[...saved].map(findStory).filter(Boolean);openOverlay("הנושאים ששמרתי",items.length?items.map(s=>`<div class="item"><small>${escapeHtml(s.category)}</small><h3>${escapeHtml(s.title)}</h3><button class="secondary" data-open="${escapeHtml(s.id)}">פתיחת הסיפור</button></div>`).join(""):'<div class="empty">עוד לא שמרת נושאים. לחיצה על ♡ בפיד תשמור אותם כאן.</div>');return}const archive=read("dyk_archive",{}),days=Object.keys(archive).sort().reverse();openOverlay("הארכיון",days.length?days.map(d=>`<div class="item"><small>${escapeHtml(d)}</small><h3>מהדורת היום — ${archive[d].length} נושאים</h3>${archive[d].map(s=>`<p><button class="secondary" data-open="${escapeHtml(s.id)}">${escapeHtml(s.title)}</button></p>`).join("")}</div>`).join(""):'<div class="empty">המהדורות הקודמות יופיעו כאן.</div>')}
function surprise(){let pool=allStories().filter(s=>!saved.has(s.id));if(!pool.length)pool=allStories();const s=pool[Math.floor(Math.random()*pool.length)];if(s)openOverlay("הפתעה מיוחדת",`<div class="surprise"><div class="tag">גילוי נוסף</div><h1>${escapeHtml(s.title)}</h1><p>${escapeHtml(s.teaser)}</p><button class="primary" data-open="${escapeHtml(s.id)}">לקריאת הסיפור</button></div>`)}
function personalizeDemo(preferences){const scores=read("dyk_interest_scores_v1",{}),pool=demo.slice(),rank=s=>(preferences.includes(categoryOf(s))?10:0)+Math.min(5,Math.max(-5,Number(scores[categoryOf(s)])||0));const preferred=pool.filter(s=>preferences.includes(categoryOf(s))).sort((a,b)=>rank(b)-rank(a));const discoveries=pool.filter(s=>!preferences.includes(categoryOf(s))).sort((a,b)=>rank(b)-rank(a));const first=[...preferred.slice(0,3),...discoveries.slice(0,2)];const used=new Set(first.map(s=>s.id));return [...first,...pool.filter(s=>!used.has(s.id)).sort((a,b)=>rank(b)-rank(a))]}
function buildEdition(){
  const day=dateKey();
  const archive=read("dyk_archive",{});
  const existing=Array.isArray(archive[day])?archive[day].filter(s=>s&&s.id&&s.title):[];
  const existingShared=existing.length===5&&existing.some(s=>s.isDemo===false);
  const preferences=read("dyk_interests_v1",[]);
  let next=[];
  sourceIsDemo=true;
  if(existingShared){
    edition=existing;
    sourceIsDemo=false;
  }else{
    if(shared.length&&window.DYKContentLoader&&window.DYKPersonalization){
      try{
        const result=window.DYKContentLoader.prepareDailyFeed({
          database:{version:1,settings:sharedSettings,articles:shared},
          engine:window.DYKPersonalization,
          interests:preferences,history,date:day
        });
        if(Array.isArray(result.articles)&&result.articles.length===5){
          next=result.articles.map(normalizeStory);
          sourceIsDemo=false;
        }
      }catch(e){console.warn("Personalized shared feed unavailable",e)}
    }
    if(sourceIsDemo){
      // Reorder the demo on every preference change, rather than reusing today's archived order.
      next=personalizeDemo(preferences);
    }
    edition=next;
    archive[day]=edition.map(s=>({...s}));
    write("dyk_archive",archive);
  }
  renderFeed();
  $("#feed").scrollTop=0;
}

$("#archiveTop").onclick=()=>listView("archive");
$("#savedTop").onclick=()=>listView("saved");
document.addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(o){openArticle(o.dataset.open);return}const sv=e.target.closest("[data-save]");if(sv){const id=sv.dataset.save,s=findStory(id);if(saved.has(id)){saved.delete(id);forgetSavedStory(id)}else{saved.add(id);rememberSavedStory(s)}write("dyk_saved",[...saved]);if(s)record(s,saved.has(id)?"save":"open");const pos=$("#feed").scrollTop;renderFeed();$("#feed").scrollTop=pos;return}const q=e.target.closest("[data-quiz]");if(q){const ok=Number(q.dataset.quiz)===Number(q.dataset.correct);document.querySelectorAll("[data-quiz]").forEach(b=>{b.disabled=true;if(Number(b.dataset.quiz)===Number(b.dataset.correct))b.classList.add("correct");else if(b===q)b.classList.add("wrong")});$("#quizResult").textContent=ok?"נכון! יפה מאוד.":"לא הפעם — התשובה הנכונה מסומנת.";return}const nav=e.target.closest("[data-view]");if(nav){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b===nav));if(nav.dataset.view==="home")closeOverlay();if(nav.dataset.view==="saved")listView("saved");if(nav.dataset.view==="archive")listView("archive");if(nav.dataset.view==="surprise")surprise()}});
async function start(){
  // Keep complete copies of saved articles, including older archived articles.
  for(const id of saved){
    if(!savedCopies()[id]){
      const story=findStory(id);
      if(story)rememberSavedStory(story);
    }
  }
  buildEdition();const interests=read("dyk_interests_v1",null);if(!Array.isArray(interests)||!interests.length)openPreferences();if(window.DYKContentLoader){try{const db=await window.DYKContentLoader.loadDatabase("./content/articles.json");shared=db.articles.map(normalizeStory);sharedSettings=db.settings;if(shared.length)buildEdition()}catch(e){console.warn("Shared database unavailable; using demo",e)}}}
start().catch(e=>{console.error("Startup error",e);edition=demo.slice();renderFeed()});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
